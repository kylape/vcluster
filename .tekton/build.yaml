# CI PipelineRun template for this repository (vCluster fork).
#
# Rendered by the polling CI service (gitlab.cee.redhat.com/klape/build):
# it substitutes repo-url, revision, image-name and push-latest for each
# default-branch push (push trigger only — the fork does not gate PRs),
# and injects the shared RWX source workspace. Reports to GitHub as the
# ci/build check (plus per-task contexts).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-template
spec:
  pipelineRef:
    name: go-build
  params:
    - name: repo-url
      value: REPLACE_BY_POLLER
    - name: revision
      value: REPLACE_BY_POLLER
    - name: image-name
      value: REPLACE_BY_POLLER
    - name: push-latest
      value: "false"
