apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vcluster-image-build-product
spec:
  description: Clone and build the vCluster image with the Red Hat Buildah Task.
  params:
    - name: git-url
      type: string
      default: https://github.com/kylape/vcluster.git
    - name: revision
      type: string
      default: codex/csi-capacity-tracing
    - name: image
      type: string
      default: quay.io/klape/vcluster:csi-capacity-debug
    - name: build-version
      type: string
      default: csi-capacity-debug
  workspaces:
    - name: source
    - name: registry-auth
  tasks:
    - name: clone
      params:
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.47.2
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -eu
              git clone --depth=1 --branch "$(params.revision)" "$(params.git-url)" .
    - name: build
      runAfter:
        - clone
      taskRef:
        name: infra-vcluster-buildah
      params:
        - name: IMAGE
          value: $(params.image)
        - name: DOCKERFILE
          value: Dockerfile
        - name: STORAGE_DRIVER
          value: vfs
        - name: FORMAT
          value: oci
        - name: BUILD_EXTRA_ARGS
          value: >-
            --build-arg TARGETOS=linux
            --build-arg TARGETARCH=amd64
            --build-arg BUILD_VERSION=$(params.build-version)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: registry-auth
