# ARC CI — generated from the stratus arc-ci workflow template
# (build-go.yml there; see the arc-ci README for design and onboarding).
# This fork tracks 'combined' (main stays aligned with upstream for a
# future re-convergence), so CI triggers and publishing follow combined.
name: build

on:
  push:
    branches: [combined]
  pull_request: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: vcluster-fork
    container: registry.access.redhat.com/ubi9/go-toolset:1.26
    env:
      # Job pods have a 4096 pids cgroup budget, and Go runtimes scale
      # their GC/runtime threads with GOMAXPROCS — an uncapped build
      # (-p = 256 cores here) exhausts it with EAGAIN on fork. 16 keeps
      # the whole build an order of magnitude under the wall.
      GOMAXPROCS: "16"
    steps:
      - name: clone
        run: |
          set -eu
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            # Fork PR heads are reachable from the base repo via pull/N/head.
            git fetch --depth 1 origin "pull/${{ github.event.pull_request.number }}/head"
          else
            git fetch --depth 1 origin "${{ github.sha }}"
          fi
          git checkout --detach FETCH_HEAD
      - name: lint
        env:
          # No cgo: skips the cgo→gcc→cc1 process chains entirely.
          CGO_ENABLED: "0"
        run: |
          set -eu
          # go install via the module proxy: the install.sh checksum
          # verification fails through this cluster's egress. v2.7.0 is
          # vcluster's own pin (.github/workflows/lint.yaml there) —
          # matching it keeps verdicts identical to upstream's fork-PR
          # lint; newer golangci versions flag findings upstream never
          # sees.
          GOBIN=/tmp/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.0
          # vcluster's .golangci.yml embeds custom plugin linters
          # (loft-sh/e2e-framework) that need a compiled plugin binary;
          # upstream's own fork-PR path strips them (see lint.yaml
          # there). .golangci-fork.yml is that stripped config,
          # committed so the job needs no yq.
          /tmp/bin/golangci-lint run --concurrency=16 --timeout 15m --config .golangci-fork.yml -- ./...
      - name: test
        run: |
          set -eu
          # Match upstream hack/test.sh's package selection: the e2e
          # suites need a live cluster (their Ginkgo BeforeSuite fails
          # without one). No -race: upstream runs the race detector in
          # its own dedicated job, and race builds add cgo compile
          # chains under the job pod's pids budget.
          # -p caps parallel package builds to match GOMAXPROCS above.
          PKGS=$(go list ./... | grep -v -e /vendor/ -e /test -e /e2e)
          go test -p 16 $PKGS

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/combined'
    runs-on: vcluster-fork-build
    container: quay.io/buildah/stable:v1.38.0
    environment: quay-push
    steps:
      - name: fetch source
        # quay.io/buildah/stable ships curl and tar but no git (its
        # install set is just buildah/fuse-overlayfs/ucpp) — pull the
        # source tarball instead. Publish only runs on pushes to main,
        # so github.sha is the ref; the tarball extracts to
        # <repo>-<sha>/, hence --strip-components=1. Bridge until the
        # purpose-built ci-driver image (buildah + git) exists.
        run: |
          set -eu
          curl -sL "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" \
            | tar xz --strip-components=1
      - name: build-and-push
        env:
          # Rootful buildah with vfs storage and chroot isolation; the
          # capabilities and UID come from the job pod's hook extension.
          # NOTE: no _CONTAINERS_ROOTLESS_UID — the job runs rootful
          # uid 0, and that var forces buildah's rootless child path
          # (unshare.Command builds a userns keyed to the claimed uid),
          # where RUN steps fail setting capabilities with EPERM.
          BUILDAH_ISOLATION: chroot
          REGISTRY_AUTH_FILE: /tmp/auth.json
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "no Dockerfile; skipping publish"
            exit 0
          fi
          echo "${{ secrets.QUAY_PASSWORD }}" | buildah login --authfile "$REGISTRY_AUTH_FILE" \
            --username "${{ secrets.QUAY_USERNAME }}" --password-stdin quay.io
          IMG="quay.io/klape/vcluster:${{ github.sha }}"
          # The ci-buildah SCC force-drops KILL and MKNOD from the pod's
          # bounding set, but buildah grants RUN children a default
          # capability set that includes KILL — its capset then fails
          # with EPERM ("error setting capabilities for process") at
          # the first RUN step. Mirror the SCC drops onto the bud
          # command; no RUN step needs them. (The old Tekton task dodged
          # this by running its build step privileged; this workflow
          # runs least-privilege with SYS_ADMIN + SYS_CHROOT instead.)
          # --ulimit: buildah's spec raises RLIMIT_NOFILE to 1048576
          # (docker's default), but this cluster's runtime gives
          # containers 524288, and raising a hard limit needs
          # CAP_SYS_RESOURCE. Pin the spec's nofile to the pod's
          # actual limits so the setrlimit is a no-op.
          buildah --storage-driver=vfs bud --cap-drop=KILL --cap-drop=MKNOD --ulimit nofile=$(ulimit -Sn):$(ulimit -Hn) --platform=linux/amd64 -f Dockerfile -t "$IMG" .
          buildah --storage-driver=vfs push "$IMG"
          buildah --storage-driver=vfs tag "$IMG" "quay.io/klape/vcluster:latest"
          buildah --storage-driver=vfs push "quay.io/klape/vcluster:latest"
